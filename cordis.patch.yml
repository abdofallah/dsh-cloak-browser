# CloakBrowser as the Harness browser: browser_* tools for every session, the exclusive
# browser-use slot, and (through the package's dsh.client half) the right-sidebar Browser
# tab with live view and take-over, which replaces the built-in iframe/webview browser tab.
# Secrets are intentionally absent: CloakBrowser reads CLOAKBROWSER_LICENSE_KEY (or
# ~/.cloakbrowser/license.key); a proxy URL is read from the variable named by proxyEnv.
# Override any value from the profile's cordis.patch.yml with `- id: cloak-browser`.
- insert:
    - id: cloak-browser
      name: 'dsh-cloak-browser'
      config:
        headless: true
        humanize: false
        profileMode: per-session
        subagentsShareBrowser: true
        maxSessions: 5
        idleCloseMinutes: 30
        legacyBinaryFallback: true
        proxyEnv: CLOAKBROWSER_PROXY_URL
        proxyFailClosed: true
        geoip: auto
        blockPrivateNetworks: false
        allowEvaluate: true
        autoSnapshot: true
        liveView: true
        inputTakesControl: true
        claimBrowserUse: true
        routePrompt: true
